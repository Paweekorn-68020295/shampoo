<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-wrapper {
      max-width: 640px;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-light);
      padding: var(--space-lg);
    }

    @media (max-width: 640px) {
      .order-wrapper {
        padding: var(--space-md) 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand-logo">Body Scent</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
        <a href="order.html" class="active">สั่งซื้อสินค้า</a>
      </nav>
    </div>
  </header>

  <!-- Order Form Section -->
  <main class="section">
    <div class="container">
      <div class="section-header">
        <span class="eyebrow">Order & Checkout</span>
        <h1>ยืนยันคำสั่งซื้อ</h1>
        <div class="divider-gold"></div>
        <p>กรุณากรอกข้อมูลสำหรับการจัดส่ง ทีมงานจะติดต่อกลับเพื่อยืนยันรายการโดยเร็วที่สุด</p>
      </div>

      <div class="order-wrapper">
        <form id="orderForm">
          <div class="form-group">
            <label for="customerName" class="form-label">ชื่อลูกค้า *</label>
            <input type="text" id="customerName" name="customerName" class="form-control" placeholder="ระบุชื่อ - นามสกุล" required>
          </div>

          <div class="form-group">
            <label for="contact" class="form-label">เบอร์โทร / Line ID *</label>
            <input type="text" id="contact" name="contact" class="form-control" placeholder="เช่น 081-234-5678 หรือ Line: @bodyscent" required>
          </div>

          <div class="form-group">
            <label for="items" class="form-label">รายการสินค้า *</label>
            <input type="text" id="items" name="items" class="form-control" placeholder="ระบุชื่อสินค้าและจำนวน" required>
          </div>

          <div class="form-group">
            <label for="total" class="form-label">จำนวนเงินรวม (บาท) *</label>
            <input type="number" id="total" name="total" class="form-control" placeholder="0" required>
          </div>

          <div class="form-group">
            <label for="note" class="form-label">หมายเหตุ / ที่อยู่จัดส่ง</label>
            <textarea id="note" name="note" class="form-control" placeholder="ระบุที่อยู่จัดส่งหรือรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
          </div>

          <button type="submit" class="btn btn--primary btn--full">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-logo">Body Scent</div>
      <p>กลิ่นหอมที่สะท้อนตัวตนและอารมณ์ของคุณในทุกวัน</p>
      <div class="footer-copy">
        &copy; 2026 Body Scent. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
